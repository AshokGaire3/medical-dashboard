services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: meddash-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - meddash-mssql:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meddash-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=MedicalDashboard;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      Jwt__Key: "dev-only-secret-change-me-32bytes-minimum"
      Jwt__Issuer: meddash
      Jwt__Audience: meddash
      Jwt__ExpiresMinutes: "120"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5000:5000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meddash-web
    depends_on:
      - api
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    ports:
      - "5173:80"

volumes:
  meddash-mssql: {}
