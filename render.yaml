# Render Blueprint — Medical Dashboard
# ─────────────────────────────────────
# Deploy steps:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect your repo; Render picks up this file automatically.
#   4. In the Render dashboard set the following "secret" env vars on the
#      `meddash-api` service BEFORE the first deploy:
#        - Jwt__Key          : any random string >= 32 characters
#        - Cors__AllowedOrigins__0 : your Vercel/Netlify frontend URL

services:
  # ── ASP.NET Core API ────────────────────────────────────────────────────────
  - type: web
    name: meddash-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:5000

      # JWT — set Jwt__Key manually in the Render dashboard (>= 32 chars).
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: meddash
      - key: Jwt__Audience
        value: meddash-clients

      # PostgreSQL — auto-populated from the database service below.
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: meddash-db
          property: connectionString

      # CORS — set to your deployed frontend URL in the Render dashboard.
      - key: Cors__AllowedOrigins__0
        sync: false

# ── Render-managed PostgreSQL (free tier) ─────────────────────────────────────
databases:
  - name: meddash-db
    plan: free
    databaseName: meddash
    user: meddash
