<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Medical Dashboard" shape-rendering="geometricPrecision">
  <!-- Flat blue tile -->
  <rect width="64" height="64" rx="12" fill="#2563eb"/>

  <!-- Bold medical cross (primary shape) -->
  <path fill="#ffffff"
        d="M24 8h16v16h16v16H40v16H24V40H8V24h16z"/>

  <!-- Stethoscope U-tube embedded in the top arm -->
  <path d="M28 22 V16 a4 4 0 0 1 8 0 V22"
        fill="none" stroke="#2563eb" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Capsule/pill embedded in the bottom arm -->
  <rect x="27" y="42" width="10" height="12" rx="5" fill="#2563eb"/>
  <line x1="27" y1="48" x2="37" y2="48" stroke="#ffffff" stroke-width="1.3"/>
</svg>
